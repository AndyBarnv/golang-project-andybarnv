syntax = "proto3";

package movies.v1;
option go_package = "github.com/AndyBarnv/golang-project-andybarnv/task4/gen/moviesv1;moviesv1";

message Movie {
  int64 id = 1;
  string title = 2;
  int32 year = 3;
  string director = 4;
}

message ItemError {
  int64 id = 1;
  string error = 2;
}

message MovieItem {
  oneof result {
    Movie movie = 1;
    ItemError error = 2;
  }
}

message LoadMoviesRequest { int64 from = 1; int64 to = 2; }
message LoadMoviesResponse {
  repeated MovieItem items = 1;
}
message GetLastMovieRequest {}

service MovieService {
  rpc LoadMovies(LoadMoviesRequest) returns (LoadMoviesResponse);
  rpc GetLastMovie(GetLastMovieRequest) returns (Movie);
}
